<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>III Copa Nada Vai Nos Separar — Ao Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --red: #D71414;
  --red-dark: #A80F0F;
  --red-deep: #4A0512;
  --white: #FFFFFF;
  --gray-100: #F6F5F4;
  --gray-200: #E9E7E5;
  --gray-300: #D8D5D2;
  --gray-500: #9A9591;
  --gray-700: #57524E;
  --ink: #211D1B;
  --gold: #B8892B;
  --gold-bg: #FBF1DD;
  --silver: #74787D;
  --silver-bg: #EEF0F1;
  --bronze: #9A5A32;
  --bronze-bg: #F5E7DB;
  --ok: #2E7D4F;
  --radius: 10px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after{ box-sizing: inherit; }
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
body{
  margin:0;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--gray-100);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --gray-100: #1B1918;
    --gray-200: #2A2725;
    --gray-300: #3A3633;
    --white: #241F1D;
    --ink: #F3F0EE;
    --gray-700: #C9C3BE;
    --gray-500: #8B857F;
  }
}
:root[data-theme="dark"]{
  --gray-100: #1B1918;
  --gray-200: #2A2725;
  --gray-300: #3A3633;
  --white: #241F1D;
  --ink: #F3F0EE;
  --gray-700: #C9C3BE;
  --gray-500: #8B857F;
}
h1,h2,h3,h4{ font-family:'Oswald', 'Inter', sans-serif; margin:0; letter-spacing: 0.01em; }
button{ font-family:'Inter', sans-serif; cursor:pointer; }
input, select{ font-family:'Inter', sans-serif; }
a{ color: var(--red); }
.wrap{ max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

/* ---------- HERO ---------- */
.hero{
  position:relative;
  background: linear-gradient(120deg, var(--red-deep), var(--red) 55%, var(--red-dark));
  color: var(--white);
  overflow:hidden;
  padding-top: env(safe-area-inset-top, 0px);
}
.hero::before{
  content:'';
  position:absolute; inset:0;
  background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,0.07) 0 14px, transparent 14px 28px);
  pointer-events:none;
}
.banner-area{
  position:relative;
  width:100%;
  aspect-ratio: 16/5;
  min-height: 140px;
  max-height: 320px;
  overflow:hidden;
  background: rgba(0,0,0,0.12);
}
.banner-area img{ width:100%; height:100%; object-fit: cover; display:block; }
.banner-empty{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:8px; color: rgba(255,255,255,0.75);
}
.banner-upload-btn{
  position:absolute; right:14px; top:14px; z-index:4;
  background: rgba(0,0,0,0.35); color:#fff; border:1px solid rgba(255,255,255,0.5);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight:500;
  backdrop-filter: blur(3px);
}
.hero-body{
  position:absolute; left:0; right:0; bottom:0; z-index:2;
  padding: 34px 20px 16px;
  max-width: 1100px; margin: 0 auto;
  display:flex; align-items:flex-end; gap:18px;
  background: linear-gradient(to top, rgba(0,0,0,0.62), rgba(0,0,0,0) 85%);
}
.logo-badge{
  width:92px; height:92px; border-radius: 50%;
  background: var(--white); border: 4px solid var(--white);
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; flex-shrink:0; position:relative;
}
.logo-badge img{ width:100%; height:100%; object-fit:cover; }
.logo-badge .placeholder{ font-family:'Oswald'; font-size:28px; color: var(--red); font-weight:600; }
.logo-upload-btn{
  position:absolute; inset:0; opacity:0; cursor:pointer;
}
.logo-edit-hint{
  position:absolute; bottom:-2px; right:-2px; background:var(--red-dark); color:#fff;
  border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center;
  font-size:13px; border: 2px solid var(--white); pointer-events:none;
}
.hero-title{ padding-bottom: 6px; }
.hero-title .eyebrow{ font-size:13px; font-weight:500; opacity:0.85; }
.hero-title h1{
  font-size: clamp(26px, 5vw, 42px);
  text-transform: uppercase;
  line-height:1.05;
  font-weight:700;
}
.event-name-input{
  font-family:'Oswald'; font-size: clamp(22px,4.5vw,38px); text-transform:uppercase;
  background: rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.4);
  border-radius:6px; padding: 4px 10px; width:100%; max-width:560px;
}
.event-name-input::placeholder{ color: rgba(255,255,255,0.6); }
.admin-control{ margin-left:auto; padding-bottom:6px; }
.login-box{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;
  background: rgba(0,0,0,0.22); border:1px solid rgba(255,255,255,0.3); border-radius:9px;
  padding:8px 10px; max-width:260px;
}
.login-box.unlocked{ background:none; border:none; padding:0; }
.login-label{ font-size:12px; color:#fff; width:100%; opacity:0.9; }
.login-input{
  border:1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.92); border-radius:6px;
  padding:6px 8px; font-size:13px; width:150px;
}
.login-box .inline-error{ width:100%; color:#FFD9D2; }
.login-toggle{ background: rgba(0,0,0,0.25); color:#fff; border:1px solid rgba(255,255,255,0.5); }
.login-toggle:hover{ background: rgba(0,0,0,0.4); }
@media (max-width: 700px){ .admin-control{ margin-left:0; width:100%; } .login-box{ max-width:none; justify-content:flex-start; } }

/* ---------- NAV ---------- */
.tabbar{
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--red);
  display:flex; overflow-x:auto; scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{ display:none; }
.tab-btn{
  background:none; border:none; color: rgba(255,255,255,0.68);
  padding: 14px 18px 12px; font-size:14.5px; font-weight:600; white-space:nowrap;
  border-bottom: 3px solid transparent;
}
.tab-btn.active{ color:#fff; border-bottom-color: var(--white); }
.tab-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline: 2px solid var(--red); outline-offset: 2px;
}

/* ---------- SHARED ---------- */
.section-title{ font-size:22px; text-transform:uppercase; margin: 28px 0 4px; }
.section-sub{ color: var(--gray-700); font-size:14px; margin-bottom:18px; }
.card{
  background: var(--white); border:1px solid var(--gray-200); border-radius: var(--radius);
  padding:16px; margin-bottom:14px;
}
.pill{
  display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
  padding: 3px 9px; border-radius:999px;
}
.pill-ouro{ background: var(--gold-bg); color: var(--gold); }
.pill-prata{ background: var(--silver-bg); color: var(--silver); }
.pill-bronze{ background: var(--bronze-bg); color: var(--bronze); }
.pill-gray{ background: var(--gray-200); color: var(--gray-700); }
.btn{
  background: var(--red); color:#fff; border:none; border-radius:7px;
  padding: 9px 16px; font-size:14px; font-weight:600;
}
.btn:hover{ background: var(--red-dark); }
.btn.secondary{ background: var(--white); color: var(--ink); border:1px solid var(--gray-300); }
.btn.secondary:hover{ background: var(--gray-100); }
.btn.small{ padding:5px 11px; font-size:12.5px; border-radius:6px; }
.readonly-banner{
  background: var(--gray-200); color:var(--gray-700); font-size:13px; padding:10px 14px;
  border-radius: var(--radius); margin: 16px 0; text-align:center;
}
.toast{
  position:fixed; left:50%; bottom: calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background: var(--ink); color: var(--white); padding:10px 18px; border-radius: 999px;
  font-size:13.5px; z-index: 60; box-shadow:0 6px 18px rgba(0,0,0,0.25); opacity:0; pointer-events:none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
.progress-track{ background: var(--gray-200); border-radius:999px; height:8px; overflow:hidden; }
.progress-fill{ background: var(--red); height:100%; border-radius:999px; }
.grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
@media (max-width: 700px){ .grid-2{ grid-template-columns:1fr; } }

/* ---------- TIMES ---------- */
.group-card h3{ font-size:17px; color: var(--red-dark); margin-bottom:10px; }
.team-row{
  display:grid; grid-template-columns: 26px 1.3fr 1fr 0.9fr; gap:8px; align-items:center; margin-bottom:8px;
}
.team-row .slot-num{
  width:26px; height:26px; border-radius:50%; background: var(--gray-200); color: var(--gray-700);
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700;
}
.team-row input{
  border:1px solid var(--gray-300); border-radius:6px; padding:7px 9px; font-size:13.5px;
  background: var(--white); color: var(--ink); width:100%;
}
.team-row input::placeholder{ color: var(--gray-500); }
.team-row input.nome-input{ font-weight:600; }
@media (max-width: 560px){
  .team-row{ grid-template-columns: 22px 1fr; grid-template-rows:auto auto; }
  .team-row .nome-input{ grid-column: 2; }
  .team-row .botonista-input, .team-row .cidade-input{ grid-column: 2; margin-top:-2px; }
}
.readonly-team{ font-size:13.5px; padding:6px 0; color: var(--ink); }
.readonly-team .muted{ color: var(--gray-500); font-size:12px; }

/* ---------- JOGOS ---------- */
.fase-heading{
  display:flex; align-items:center; gap:10px; margin: 22px 0 10px;
}
.fase-heading h4{ font-size:15px; text-transform:uppercase; color: var(--gray-700); }
.grupo-block{ margin-bottom:22px; }
.rodada-label{ font-size:12px; font-weight:600; color: var(--gray-500); text-transform:uppercase; margin: 10px 0 6px; }
.match-card{
  background: var(--white); border:1px solid var(--gray-200); border-radius: var(--radius);
  padding:12px 14px; margin-bottom:8px;
}
.match-card.pending-teams{ background: var(--gray-100); border-style:dashed; }
.match-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.match-num{ font-size:11.5px; font-weight:700; color: var(--gray-500); letter-spacing:0.03em; }
.match-group-tag{ font-size:11.5px; color: var(--gray-500); margin-left:6px; }
.match-teams{ display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:10px; }
.team-name{ font-size:14.5px; font-weight:600; }
.team-name.tbd{ color: var(--gray-500); font-weight:500; font-style:italic; font-size:13px; }
.team-name.right{ text-align:right; }
.score-box{ display:flex; align-items:center; gap:6px; }
.score-box input[type=number]{
  width:44px; text-align:center; padding:6px 2px; border:1px solid var(--gray-300); border-radius:6px; font-size:15px;
  font-weight:700; background: var(--white); color: var(--ink);
}
.score-x{ color: var(--gray-500); font-size:13px; }
.mesa-input{ width:72px; padding:4px 7px; border:1px solid var(--gray-300); border-radius:6px; font-size:12px; background: var(--white); color: var(--ink); text-align:center; }
.mesa-badge{ display:inline-flex; align-items:center; gap:5px; }
.mesa-edit-btn{
  background:none; border:none; padding:0 0 0 2px; font-size:12px; line-height:1; color: var(--gray-700);
  cursor:pointer;
}
.mesa-edit-btn:hover{ color: var(--red); }
.cronograma-block{ background: var(--white); border:1px solid var(--gray-200); border-radius: var(--radius); overflow:hidden; margin-bottom:8px; }
.cronograma-row{ display:flex; align-items:center; gap:12px; padding:9px 14px; border-bottom:1px solid var(--gray-200); font-size:13.5px; }
.cronograma-row:last-child{ border-bottom:none; }
.cronograma-mesa{ font-family:'Oswald'; font-weight:600; color: var(--red-dark); width:64px; flex-shrink:0; font-size:14px; }
.cronograma-teams{ flex:1; font-weight:600; }
@media (max-width: 560px){
  .cronograma-row{ flex-wrap:wrap; }
  .cronograma-mesa{ width:auto; }
}
.score-readonly{ font-family:'Oswald'; font-size:20px; font-weight:600; letter-spacing:0.06em; }
.match-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
.tiebreak-row{ margin-top:8px; font-size:12.5px; }
.autosave-hint{ margin-top:7px; font-size:11.5px; color: var(--gray-500); font-style:italic; }
.tiebreak-row select{ padding:5px 8px; border-radius:6px; border:1px solid var(--gray-300); font-size:12.5px; }
.inline-error{ color: var(--red); font-size:12px; margin-top:6px; }
.winner-tag{ font-size:11px; color: var(--ok); font-weight:700; text-transform:uppercase; margin-top:4px; }

/* ---------- CLASSIFICAÇÃO ---------- */
table.stand{ width:100%; border-collapse:collapse; font-size:13px; }
table.stand th{
  background: var(--red); color:#fff; font-weight:600; font-size:11px; text-transform:uppercase;
  padding:7px 5px; text-align:center;
}
table.stand th:first-child, table.stand td:first-child{ text-align:left; padding-left:8px; }
table.stand td{ padding:7px 5px; text-align:center; border-bottom:1px solid var(--gray-200); }
table.stand tr:last-child td{ border-bottom:none; }
.pos-badge{ display:inline-flex; width:20px; height:20px; border-radius:5px; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-right:6px; }
.pos-1, .pos-2{ background: var(--gold-bg); color: var(--gold); }
.pos-3{ background: var(--silver-bg); color: var(--silver); }
.pos-4{ background: var(--bronze-bg); color: var(--bronze); }
.tie-warning{
  background: #FCEEEA; border:1px solid #F0C9BC; color: var(--red-dark); font-size:12.5px;
  padding:8px 10px; border-radius:7px; margin: 8px 0;
}
.reorder-btns{ display:flex; gap:3px; justify-content:center; }
.reorder-btns button{ background:var(--gray-200); border:none; border-radius:4px; width:20px; height:20px; font-size:11px; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; font-size:12.5px; color: var(--gray-700); }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.legend .dot{ width:10px; height:10px; border-radius:3px; }

/* ---------- CHAVEAMENTO ---------- */
.chave-title{ font-size:18px; color: var(--red-dark); text-transform:uppercase; margin: 26px 0 4px; }
.serie-block{ margin-bottom: 26px; }
.serie-label{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.bracket{ display:flex; gap:22px; overflow-x:auto; padding-bottom:6px; }
.bracket-round{ display:flex; flex-direction:column; justify-content: space-around; gap:14px; min-width:190px; }
.bracket-round .rlabel{ font-size:10.5px; text-transform:uppercase; color: var(--gray-500); font-weight:700; margin-bottom:2px; text-align:center; }
.bmatch{
  background: var(--white); border:1px solid var(--gray-200); border-left:3px solid var(--gray-300);
  border-radius:8px; padding:8px 10px; font-size:12.5px;
}
.bmatch.serie-ouro{ border-left-color: var(--gold); }
.bmatch.serie-prata{ border-left-color: var(--silver); }
.bmatch.serie-bronze{ border-left-color: var(--bronze); }
.bmatch .brow{ display:flex; justify-content:space-between; gap:6px; padding:2px 0; }
.bmatch .brow.win{ font-weight:700; }
.bmatch .brow .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.champion-card{
  background: linear-gradient(135deg, var(--red), var(--red-dark)); color:#fff; border-radius: var(--radius);
  padding:16px 18px; margin-top:8px;
}
.champion-card h4{ font-size:12px; text-transform:uppercase; opacity:0.85; margin-bottom:4px; }
.champion-card .name{ font-family:'Oswald'; font-size:22px; text-transform:uppercase; }
.footer-note{ text-align:center; color: var(--gray-500); font-size:12px; margin-top:40px; }
</style>
</head>

function applyIncoming(data){
  STATE = {
    event: {
      nome: (data.event && data.event.nome) ? data.event.nome : DEFAULT_NOME,
      logo: DEFAULT_LOGO || null,
      banner: DEFAULT_BANNER || null,
      adminPasswordHash: null
    },
    groups: data.groups,
    matches: data.matches
  };
}

function fetchState(isFirst){
  if(!SYNC_URL){ loadError = true; render(); return; }
  fetch(SYNC_URL, { cache:'no-store' }).then(function(r){
    if(!r.ok) throw new Error('http '+r.status);
    return r.json();
  }).then(function(data){
    applyIncoming(data);
    lastSyncAt = new Date();
    syncError = false;
    loadError = false;
    render();
  }).catch(function(e){
    syncError = true;
    if(isFirst) loadError = true;
    render();
  });
}

/* ============ helpers (idênticos ao app principal) ============ */
function escapeHtml(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function ordinal(n){ return ['','1º','2º','3º','4º'][n] || (n+'º'); }
function getTeam(id){
  var g = id[0];
  var group = STATE.groups[g];
  if(!group) return null;
  for(var i=0;i<group.teams.length;i++){ if(group.teams[i].id===id) return group.teams[i]; }
  return null;
}
function teamLabel(t){ return (t && t.nome && t.nome.trim()) ? t.nome.trim() : ('Time '+ (t?t.id:'?')); }
function groupRoundMatches(g, r){
  return STATE.matches.filter(function(m){ return m.fase==='grupos' && m.grupo===g && m.rodada===r; });
}
function groupStageAutoMesa(m){
  if(m.fase!=='grupos') return null;
  var gi = GROUP_LETTERS.indexOf(m.grupo);
  var ms = groupRoundMatches(m.grupo, m.rodada);
  var which = ms.indexOf(m);
  if(which<0) which = 0;
  var shift = (m.rodada-1)*2;
  var pos0 = gi*2 + which;
  var mesa0 = (pos0 + shift) % 16;
  return mesa0 + 1;
}
function computeCronograma(){
  var result = {};
  [1,2,3].forEach(function(r){
    var shift = (r-1)*2;
    var slots = new Array(16);
    GROUP_LETTERS.forEach(function(g, gi){
      groupRoundMatches(g, r).forEach(function(m, which){
        var pos0 = gi*2 + which;
        var mesa0 = (pos0 + shift) % 16;
        slots[mesa0] = m;
      });
    });
    result[r] = slots;
  });
  return result;
}
function groupComplete(g){
  return STATE.matches.filter(function(m){ return m.fase==='grupos' && m.grupo===g; })
    .every(function(m){ return m.status==='realizado'; });
}
function computeStandings(g){
  var group = STATE.groups[g];
  var stats = {};
  group.teams.forEach(function(t){ stats[t.id] = { team:t, J:0,V:0,E:0,D:0,GP:0,GC:0,SG:0,Pts:0, tied:false }; });
  STATE.matches.filter(function(m){ return m.fase==='grupos' && m.grupo===g && m.status==='realizado'; }).forEach(function(m){
    var a = stats[m.timeA.id], b = stats[m.timeB.id];
    a.J++; b.J++;
    a.GP += m.golsA; a.GC += m.golsB;
    b.GP += m.golsB; b.GC += m.golsA;
    if(m.golsA > m.golsB){ a.V++; a.Pts+=3; b.D++; }
    else if(m.golsB > m.golsA){ b.V++; b.Pts+=3; a.D++; }
    else { a.E++; b.E++; a.Pts+=1; b.Pts+=1; }
  });
  Object.keys(stats).forEach(function(id){ stats[id].SG = stats[id].GP - stats[id].GC; });
  var arr = Object.keys(stats).map(function(id){ return stats[id]; });
  var manual = group.manualOrder;
  if(manual && manual.length===4 && manual.every(function(id){ return stats[id]; })){
    arr = manual.map(function(id){ return stats[id]; });
  } else {
    arr.sort(function(x,y){
      return (y.Pts-x.Pts) || (y.V-x.V) || (y.GP-x.GP) || (y.SG-x.SG);
    });
    for(var i=0;i<arr.length-1;i++){
      var x=arr[i], y=arr[i+1];
      if(x.Pts===y.Pts && x.V===y.V && x.GP===y.GP && x.SG===y.SG){ x.tied=true; y.tied=true; }
    }
  }
  return arr;
}
function resolveRef(ref){
  if(!ref) return null;
  if(ref.type==='time') return getTeam(ref.id);
  if(ref.type==='pos'){
    if(!groupComplete(ref.grupo)) return null;
    var st = computeStandings(ref.grupo);
    return st[ref.pos-1] ? st[ref.pos-1].team : null;
  }
  if(ref.type==='winner'){
    var m = STATE.matches.filter(function(x){ return x.id===ref.matchId; })[0];
    if(!m || m.status!=='realizado') return null;
    return winnerOfMatch(m);
  }
  return null;
}
function winnerOfMatch(m){
  if(m.status!=='realizado') return null;
  if(m.golsA > m.golsB) return resolveRef(m.timeA);
  if(m.golsB > m.golsA) return resolveRef(m.timeB);
  if(m.vencedorManual==='A') return resolveRef(m.timeA);
  if(m.vencedorManual==='B') return resolveRef(m.timeB);
  return null;
}
function refLabel(ref){
  if(ref.type==='pos') return ordinal(ref.pos) + ' do Grupo ' + ref.grupo + ' — a definir';
  if(ref.type==='winner') return 'Vencedor do Jogo ' + ref.matchId;
  return '—';
}
function matchById(id){ return STATE.matches.filter(function(m){ return m.id===id; })[0]; }

/* ============ render: HERO ============ */
function timeAgoLabel(){
  if(!lastSyncAt) return '';
  var s = Math.max(0, Math.round((Date.now() - lastSyncAt.getTime())/1000));
  if(s < 5) return 'agora mesmo';
  if(s < 60) return 'há ' + s + 's';
  var mins = Math.round(s/60);
  return 'há ' + mins + (mins===1?' min':' min');
}
function renderAdminControl(){
  var statusText = syncError ? 'Sem conexão — tentando de novo…' : ('Atualizado ' + timeAgoLabel());
  return '<div class="login-box unlocked">'+
    '<span class="pill pill-gray">'+(syncError?'⚠️':'🔴')+' '+(syncError?'Reconectando':'Ao vivo')+'</span>'+
    '<span style="font-size:11.5px;color:rgba(255,255,255,0.8);">'+statusText+'</span>'+
    '<button type="button" class="btn secondary small" data-action="manual-refresh">Atualizar agora</button>'+
  '</div>';
}
function renderHero(){
  var ev = STATE.event;
  var bannerInner = ev.banner
    ? '<img src="'+ev.banner+'" alt="Banner do evento">'
    : '<div class="banner-empty"><span style="font-size:22px;">🏆</span></div>';
  var logoInner = ev.logo
    ? '<img src="'+ev.logo+'" alt="Logo do evento">'
    : '<span class="placeholder">🏓</span>';
  var titleHtml = '<h1>'+escapeHtml(ev.nome)+'</h1>';
  return ''+
  '<div class="hero">'+
    '<div class="banner-area">'+bannerInner+
      '<div class="hero-body">'+
        '<div class="logo-badge">'+logoInner+'</div>'+
        '<div class="hero-title">'+
          '<div class="eyebrow">Futebol de mesa · 32 times · 8 grupos · acompanhamento ao vivo</div>'+
          titleHtml+
        '</div>'+
        '<div class="admin-control">'+renderAdminControl()+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="tabbar">'+
      tabBtn('visao','Visão geral')+
      tabBtn('times','Times')+
      tabBtn('jogos','Jogos')+
      tabBtn('cronograma','Cronograma')+
      tabBtn('classificacao','Classificação')+
      tabBtn('chaveamento','Chaveamento')+
    '</div>'+
  '</div>';
}
function tabBtn(id, label){
  return '<button class="tab-btn'+(currentTab===id?' active':'')+'" data-action="set-tab" data-tab="'+id+'">'+label+'</button>';
}

/* ============ render: VISÃO GERAL ============ */
function renderVisao(){
  var grupoMatches = STATE.matches.filter(function(m){ return m.fase==='grupos'; });
  var done = grupoMatches.filter(function(m){ return m.status==='realizado'; }).length;
  var pct = Math.round(100*done/grupoMatches.length);
  var html = '<div class="wrap">';
  html += '<h2 class="section-title">Andamento do campeonato</h2>';
  html += '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--gray-700);margin-bottom:6px;"><span>Fase de grupos</span><span>'+done+' de '+grupoMatches.length+' jogos</span></div>';
  html += '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div>';
  html += '</div>';

  html += '<div class="card"><h3 style="font-size:15px;color:var(--red-dark);margin-bottom:8px;">Campeões</h3>';
  [['ouro','Ouro',75],['prata','Prata',76],['bronze','Bronze',77]].forEach(function(s){
    var champ = winnerOfMatch(matchById(s[2]));
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--gray-200);font-size:14px;">';
    html += '<span class="pill pill-'+s[0]+'">'+s[1]+'</span>';
    html += '<span style="font-weight:'+(champ?'700':'400')+';color:'+(champ?'var(--ink)':'var(--gray-500)')+';">'+(champ?escapeHtml(teamLabel(champ))+' 🏆':'em andamento')+'</span>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="card" style="font-size:13.5px;color:var(--gray-700);line-height:1.6;">';
  html += '<strong style="color:var(--ink);">Como funciona:</strong> cada grupo joga turno único entre si (jogos 1 a 48). Em cada grupo, o 1º e o 2º colocado avançam para a <strong>Série Ouro</strong> (16 times, mata-mata desde as oitavas de final), o 3º para a <strong>Série Prata</strong> e o 4º para a <strong>Série Bronze</strong> (8 times cada, mata-mata desde as quartas de final). As três séries terminam em uma final única, com um campeão só para cada uma.';
  html += '</div>';
  html += '</div>';
  return html;
}

/* ============ render: TIMES ============ */
function renderTimes(){
  var html = '<div class="wrap">';
  html += '<h2 class="section-title">Times por grupo</h2>';
  html += '<div class="grid-2">';
  GROUP_LETTERS.forEach(function(g){
    var group = STATE.groups[g];
    html += '<div class="card group-card"><h3>Grupo '+g+'</h3>';
    group.teams.forEach(function(t, idx){
      html += '<div class="readonly-team"><strong>'+(idx+1)+'.</strong> '+escapeHtml(teamLabel(t))+
        (t.botonista?' <span class="muted">— '+escapeHtml(t.botonista)+'</span>':'')+
        (t.cidade?' <span class="muted">('+escapeHtml(t.cidade)+')</span>':'')+'</div>';
    });
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

/* ============ render: JOGOS ============ */
function mesaControlHtml(m){
  var auto = (m.fase==='grupos') ? groupStageAutoMesa(m) : null;
  var displayVal = (m.mesa && String(m.mesa).trim()) ? String(m.mesa) : (auto!=null ? String(auto) : '');
  if(displayVal) return '<span class="pill pill-gray">Mesa '+escapeHtml(displayVal)+'</span>';
  return '';
}
function renderMatchCard(m){
  var ta = resolveRef(m.timeA), tb = resolveRef(m.timeB);
  var resolved = ta && tb;
  var nameA = ta ? escapeHtml(teamLabel(ta)) : refLabel(m.timeA);
  var nameB = tb ? escapeHtml(teamLabel(tb)) : refLabel(m.timeB);

  var groupTag = (m.fase==='grupos') ? ' <span class="match-group-tag">Grupo '+m.grupo+'</span>' : '';

  if(!resolved){
    return '<div class="match-card pending-teams" data-match="'+m.id+'">'+
      '<div class="match-top"><span><span class="match-num">Jogo '+m.id+'</span>'+groupTag+'</span>'+mesaControlHtml(m)+'</div>'+
      '<div class="match-teams"><span class="team-name tbd">'+nameA+'</span><span class="score-x">×</span><span class="team-name tbd right">'+nameB+'</span></div>'+
    '</div>';
  }

  var html = '<div class="match-card" data-match="'+m.id+'">';
  html += '<div class="match-top"><span><span class="match-num">Jogo '+m.id+'</span>'+groupTag+'</span>'+mesaControlHtml(m)+'</div>';

  if(m.status==='realizado'){
    var aWin = m.golsA>m.golsB || (m.golsA===m.golsB && m.vencedorManual==='A');
    var bWin = m.golsB>m.golsA || (m.golsA===m.golsB && m.vencedorManual==='B');
    html += '<div class="match-teams">';
    html += '<span class="team-name" style="'+(aWin?'':'opacity:0.6;')+'">'+nameA+'</span>';
    html += '<span class="score-readonly">'+m.golsA+' – '+m.golsB+'</span>';
    html += '<span class="team-name right" style="'+(bWin?'':'opacity:0.6;')+'">'+nameB+'</span>';
    html += '</div>';
    if(m.golsA===m.golsB && m.fase!=='grupos'){
      html += '<div class="winner-tag">Venceu nos pênaltis: '+(m.vencedorManual==='A'?nameA:nameB)+'</div>';
    }
  } else {
    html += '<div class="match-teams">'+
      '<span class="team-name">'+nameA+'</span>'+
      '<span class="score-x">×</span>'+
      '<span class="team-name right">'+nameB+'</span>'+
    '</div>';
  }
  html += '</div>';
  return html;
}
function renderJogos(){
  var html = '<div class="wrap">';
  html += '<h2 class="section-title">Jogos e resultados</h2>';

  html += '<div class="fase-heading"><h4>Fase de grupos — jogos 1 a 48</h4></div>';
  var cronJogos = computeCronograma();
  [1,2,3].forEach(function(r){
    html += '<div class="rodada-label">Rodada '+r+'</div>';
    cronJogos[r].forEach(function(m){
      if(m) html += renderMatchCard(m);
    });
  });

  html += '<div class="fase-heading"><h4>Mata-mata — jogos 49 a 77</h4></div>';
  ['ouro','prata','bronze'].forEach(function(serie){
    var ms = STATE.matches.filter(function(m){ return m.fase===serie && m.grupo===null; });
    if(!ms.length) return;
    html += '<div style="margin-bottom:14px;"><span class="pill pill-'+serie+'">'+SERIE_LABEL[serie]+'</span></div>';
    var rounds = [];
    ms.forEach(function(m){ if(rounds.indexOf(m.rodada)===-1) rounds.push(m.rodada); });
    rounds.forEach(function(r){
      html += '<div class="rodada-label">'+r+'</div>';
      ms.filter(function(m){ return m.rodada===r; }).forEach(function(m){ html += renderMatchCard(m); });
    });
  });

  html += '</div>';
  return html;
}

/* ============ render: CLASSIFICAÇÃO ============ */
function renderClassificacao(){
  var html = '<div class="wrap">';
  html += '<h2 class="section-title">Classificação por grupo</h2>';
  html += '<div class="legend">'+
    '<span><span class="dot" style="background:var(--gold);"></span>1º e 2º → Série Ouro</span>'+
    '<span><span class="dot" style="background:var(--silver);"></span>3º → Série Prata</span>'+
    '<span><span class="dot" style="background:var(--bronze);"></span>4º → Série Bronze</span>'+
  '</div>';
  html += '<div class="grid-2">';
  GROUP_LETTERS.forEach(function(g){
    var standings = computeStandings(g);
    html += '<div class="card"><h3 style="font-size:15px;color:var(--red-dark);margin-bottom:8px;">Grupo '+g+'</h3>';
    html += '<table class="stand"><thead><tr><th>Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody>';
    standings.forEach(function(s, idx){
      html += '<tr>';
      html += '<td><span class="pos-badge pos-'+(idx+1)+'">'+(idx+1)+'</span>'+escapeHtml(teamLabel(s.team))+'</td>';
      html += '<td><strong>'+s.Pts+'</strong></td><td>'+s.J+'</td><td>'+s.V+'</td><td>'+s.E+'</td><td>'+s.D+'</td><td>'+s.GP+'</td><td>'+s.GC+'</td><td>'+s.SG+'</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

/* ============ render: CHAVEAMENTO ============ */
function bMatchHtml(m, serie){
  var ta = resolveRef(m.timeA), tb = resolveRef(m.timeB);
  var nameA = ta ? escapeHtml(teamLabel(ta)) : escapeHtml(refLabel(m.timeA));
  var nameB = tb ? escapeHtml(teamLabel(tb)) : escapeHtml(refLabel(m.timeB));
  var aWin=false, bWin=false;
  if(m.status==='realizado'){
    aWin = m.golsA>m.golsB || (m.golsA===m.golsB && m.vencedorManual==='A');
    bWin = m.golsB>m.golsA || (m.golsA===m.golsB && m.vencedorManual==='B');
  }
  return '<div class="bmatch serie-'+serie+'">'+
    (m.mesa ? '<div style="font-size:10px;color:var(--gray-500);margin-bottom:2px;">Mesa '+escapeHtml(String(m.mesa))+'</div>' : '')+
    '<div class="brow'+(aWin?' win':'')+'"><span class="nm">'+nameA+'</span></div>'+
    '<div class="brow'+(bWin?' win':'')+'"><span class="nm">'+nameB+'</span></div>'+
    (m.status==='realizado' ? '<div style="text-align:right;font-size:11px;color:var(--gray-500);margin-top:2px;">'+m.golsA+' – '+m.golsB+'</div>' : '')+
  '</div>';
}
function renderChaveSerie(serie){
  var ms = STATE.matches.filter(function(m){ return m.fase===serie && m.grupo===null; });
  if(!ms.length) return '';
  var rounds = [];
  ms.forEach(function(m){ if(rounds.indexOf(m.rodada)===-1) rounds.push(m.rodada); });
  var html = '<div class="serie-block"><div class="serie-label"><span class="pill pill-'+serie+'">'+SERIE_LABEL[serie]+'</span></div>';
  html += '<div class="bracket">';
  rounds.forEach(function(r){
    html += '<div class="bracket-round"><div class="rlabel">'+r+'</div>';
    ms.filter(function(m){ return m.rodada===r; }).forEach(function(m){ html += bMatchHtml(m, serie); });
    html += '</div>';
  });
  html += '</div>';
  var finalMatch = ms[ms.length-1];
  var champ = winnerOfMatch(finalMatch);
  if(champ){
    html += '<div class="champion-card"><h4>Campeão — '+SERIE_LABEL[serie]+'</h4><div class="name">🏆 '+escapeHtml(teamLabel(champ))+'</div></div>';
  }
  html += '</div>';
  return html;
}
function renderChaveamento(){
  var html = '<div class="wrap">';
  html += '<h2 class="section-title">Chaveamento — mata-mata</h2>';
  html += '<p class="section-sub">16 times na Série Ouro, 8 na Prata e 8 na Bronze — um único chaveamento até a final, cada série com um campeão. Os confrontos aparecem assim que os times envolvidos forem definidos.</p>';
  html += renderChaveSerie('ouro');
  html += renderChaveSerie('prata');
  html += renderChaveSerie('bronze');
  html += '<div class="footer-note">III Copa Nada Vai Nos Separar</div>';
  html += '</div>';
  return html;
}

/* ============ render: CRONOGRAMA ============ */
function renderCronograma(){
  var cron = computeCronograma();
  var html = '<div class="wrap">';
  html += '<h2 class="section-title">Cronograma — fase de grupos</h2>';
  html += '<p class="section-sub">Jogos da fase de grupos distribuídos nas 16 mesas do evento.</p>';
  [1,2,3].forEach(function(r){
    html += '<div class="fase-heading"><h4>Rodada '+r+'</h4></div>';
    html += '<div class="cronograma-block">';
    var slots = cron[r];
    for(var i=0;i<16;i++){
      var m = slots[i];
      if(!m) continue;
      var ta = getTeam(m.timeA.id), tb = getTeam(m.timeB.id);
      html += '<div class="cronograma-row">'+
        '<span class="cronograma-mesa">Mesa '+(i+1)+'</span>'+
        '<span class="cronograma-teams">'+escapeHtml(teamLabel(ta))+' <span class="score-x">×</span> '+escapeHtml(teamLabel(tb))+'</span>'+
        '<span class="pill pill-gray">Grupo '+m.grupo+'</span>'+
      '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

/* ============ main render ============ */
function render(){
  var app = document.getElementById('app');
  if(!STATE){
    if(loadError){
      app.innerHTML = '<div class="wrap" style="padding-top:60px;text-align:center;">'+
        '<h2 class="section-title">Não foi possível carregar</h2>'+
        '<p class="section-sub">Verifique sua internet e tente novamente. Se o problema continuar, avise o organizador.</p>'+
        '<button class="btn" data-action="manual-refresh">Tentar de novo</button>'+
      '</div>';
    } else {
      app.innerHTML = '<div class="wrap" style="padding-top:60px;text-align:center;">'+
        '<h2 class="section-title">Carregando…</h2>'+
        '<p class="section-sub">Buscando os dados mais recentes do campeonato.</p>'+
      '</div>';
    }
    return;
  }
  var body = '';
  if(currentTab==='visao') body = renderVisao();
  else if(currentTab==='times') body = renderTimes();
  else if(currentTab==='jogos') body = renderJogos();
  else if(currentTab==='cronograma') body = renderCronograma();
  else if(currentTab==='classificacao') body = renderClassificacao();
  else if(currentTab==='chaveamento') body = renderChaveamento();
  app.innerHTML = renderHero() + body;
}

/* ============ events ============ */
document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  var action = btn.getAttribute('data-action');
  if(action==='set-tab'){
    currentTab = btn.getAttribute('data-tab');
    try{ localStorage.setItem(LAST_TAB_KEY, currentTab); }catch(e){}
    render();
    return;
  }
  if(action==='manual-refresh'){
    fetchState(!STATE);
    return;
  }
});

/* ============ init ============ */
fetchState(true);
setInterval(function(){ fetchState(false); }, POLL_MS);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') fetchState(false);
});

})();

</script>
