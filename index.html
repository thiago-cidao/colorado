<script>
"use strict";
/* ===== SHA-256 puro (sem dependências) ===== */
function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}var maxW=64,mp=Math.pow,ml=mp(2,32),res='',words=[],bl=ascii.length*8,h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],k=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(var i=0;i<ascii.length;i++){var j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=(bl/mp(2,32))|0;words[words.length]=bl;for(var j2=0;j2<words.length;){var w=words.slice(j2,j2+=16),oh=h;h=h.slice(0,8);for(var i2=0;i2<maxW;i2++){var w15=w[i2-15],w2=w[i2-2],a=h[0],e=h[4],t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i2]+(w[i2]=(i2<16)?w[i2]:(w[i2-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i2-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}for(var i3=0;i3<8;i3++)h[i3]=(h[i3]+oh[i3])|0}for(var i4=0;i4<8;i4++)for(var j3=3;j3+1;j3--){var b=(h[i4]>>(j3*8))&255;res+=((b<16)?'0':'')+b.toString(16)}return res}
function hhex(s){return sha256(unescape(encodeURIComponent(s)))}

/* ===== CONSTANTES ===== */
var GROUPS=["A","B","C","D","E","F","G","H"];
var LS_STATE="copa3_state_v1", LS_HASH="copa3_admin_hash", LS_SESS="copa3_admin_session";
/* Senha do admin já definida (hash SHA-256). Troque pela tela "Trocar senha" se quiser. */
var ADMIN_HASH="a73060afb61efe1b7c817645d00c342df02407f65435a64c88d251d56150ff42";
var SAVE_DELAY=4000;

/* ===== ESTADO ===== */
function blankTeams(){var o={};GROUPS.forEach(function(g){o[g]=[0,1,2,3].map(function(){return{name:"",player:"",city:""}})});return o}
function blankScores(){return{}}
function defaultState(){return{eventName:"III COPA NADA VAI NOS SEPARAR",banner:"",logo:"",teams:blankTeams(),inscritos:[],scores:{},pen:{},mesa:{},manual:null,spotlight:[]}}
function distribute(list){var t=blankTeams();var cnt={};GROUPS.forEach(function(g){cnt[g]=0});(list||[]).forEach(function(r){if(!r||!r.group||GROUPS.indexOf(r.group)<0)return;var g=r.group;if(cnt[g]>=4)return;t[g][cnt[g]++]={name:r.name||"",player:r.player||"",city:r.city||""}});return t}
function normalize(p){var d=defaultState();var s=Object.assign(d,p||{});if(!Array.isArray(s.inscritos)){var mig=[];GROUPS.forEach(function(g){((s.teams||{})[g]||[]).forEach(function(t){if(t&&t.name)mig.push({name:t.name||"",player:t.player||"",city:t.city||"",group:g})})});s.inscritos=mig}if(!s.teams||typeof s.teams!=="object")s.teams=d.teams;GROUPS.forEach(function(g){if(!s.teams[g]||!Array.isArray(s.teams[g])||s.teams[g].length!==4){s.teams[g]=d.teams[g]}else{s.teams[g]=s.teams[g].map(function(t){return{name:(t&&t.name)||"",player:(t&&t.player)||"",city:(t&&t.city)||""}})}});s.teams=distribute(s.inscritos);if(!s.scores)s.scores={};if(!s.pen)s.pen={};if(!s.mesa)s.mesa={};if(!Array.isArray(s.spotlight))s.spotlight=[];s.spotlight=s.spotlight.filter(Boolean).map(function(c){return{photo:(c&&c.photo)||"",team:(c&&c.team)||"",name:(c&&c.name)||"",city:(c&&c.city)||""}});return s}
var S=defaultState();
function load(){try{var raw=localStorage.getItem(LS_STATE);if(raw){var p=JSON.parse(raw);if(p&&p.teams){S=normalize(p);return}}}catch(e){} }
load();
var isAdmin=localStorage.getItem(LS_SESS)==="1";
var tab="overview";
var editingTeam=null;

/* ===== JOGOS FASE DE GRUPOS (estrutura fixa) =====
R1: 0v1, 2v3 | R2: 0v2, 1v3 | R3: 0v3, 1v2 */
var ROUNDS=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
function groupGames(){var out=[],id=1;GROUPS.forEach(function(g){for(var r=0;r<3;r++){ROUNDS[r].forEach(function(p,k){out.push({id:id++,group:g,round:r+1,k:k,home:p[0],away:p[1]})})}});return out}
var GGAMES=groupGames();
function gid(game){return "G"+game.id}
function gScore(game){var s=S.scores[gid(game)];return s||{}}
function hasResultG(game){var s=gScore(game);return s.h!=null&&s.h!==""&&s.a!=null&&s.a!==""}

/* Mesa automática grupos: determinística */
function autoMesaG(game){var gi=GROUPS.indexOf(game.group);return ((gi*2+(game.round-1)*2+game.k)%16)+1}
function mesaG(game){var m=S.mesa[gid(game)];return (m!=null&&m!=="")?m:String(autoMesaG(game))}

/* ===== CLASSIFICAÇÃO ===== */
function standings(g){
  var T=S.teams[g];var rows=[0,1,2,3].map(function(i){return{i:i,J:0,V:0,E:0,D:0,GP:0,GC:0,SG:0,Pts:0}});
  GGAMES.filter(function(x){return x.group===g}).forEach(function(game){
    var s=gScore(game);if(!hasResultG(game))return;
    var h=+s.h,a=+s.a;var R0=rows[game.home],R1=rows[game.away];
    R0.J++;R1.J++;R0.GP+=h;R0.GC+=a;R1.GP+=a;R1.GC+=h;
    if(h>a){R0.V++;R1.D++;R0.Pts+=3}else if(h<a){R1.V++;R0.D++;R1.Pts+=3}else{R0.E++;R1.E++;R0.Pts++;R1.Pts++}
  });
  rows.forEach(function(r){r.SG=r.GP-r.GC});
  var auto=rows.slice().sort(function(x,y){if(y.Pts!==x.Pts)return y.Pts-x.Pts;if(y.V!==x.V)return y.V-x.V;if(y.GP!==x.GP)return y.GP-x.GP;if(y.SG!==x.SG)return y.SG-x.SG;return 0});
  // empates: grupos com 4 critérios iguais
  var tied={};for(var i=0;i<auto.length;i++)for(var j=i+1;j<auto.length;j++){var A=auto[i],B=auto[j];if(A.Pts===B.Pts&&A.V===B.V&&A.GP===B.GP&&A.SG===B.SG&&(A.J>0||B.J>0)){tied[A.i]=1;tied[B.i]=1}}
  var order=null;
  if(S.manual&&S.manual[g]&&S.manual[g].length===4){order=S.manual[g].map(function(i){return rows[i]});}
  else order=auto;
  return{rows:rows,order:order,tied:tied,auto:auto};
}
function teamName(g,i){var t=(S.teams[g]||[])[i];return(t&&t.name)?t.name:""}
function posTeam(g,pos){var st=standings(g);var r=st.order[pos-1];if(!r)return null;var nm=teamName(g,r.i);return{group:g,idx:r.i,name:nm,empty:!nm}}

/* ===== MATA-MATA ===== */
function KO(){
  var arr=[];function add(id,serie,fase,a,b,mesaDef){arr.push({id:id,serie:serie,fase:fase,a:a,b:b,mesaDef:mesaDef})}
  function G(g,p){return{type:"group",group:g,pos:p}}
  function W(id){return{type:"winner",game:id}}
  // Ouro - oitavas (16 primeiros jogos -> mesa 1..8)
  add("O1","OURO","Oitavas",G("A",1),G("H",2),1);add("O2","OURO","Oitavas",G("B",1),G("G",2),2);
  add("O3","OURO","Oitavas",G("C",1),G("F",2),3);add("O4","OURO","Oitavas",G("D",1),G("E",2),4);
  add("O5","OURO","Oitavas",G("E",1),G("D",2),5);add("O6","OURO","Oitavas",G("F",1),G("C",2),6);
  add("O7","OURO","Oitavas",G("G",1),G("B",2),7);add("O8","OURO","Oitavas",G("H",1),G("A",2),8);
  add("OQ1","OURO","Quartas",W("O1"),W("O2"),null);add("OQ2","OURO","Quartas",W("O3"),W("O4"),null);
  add("OQ3","OURO","Quartas",W("O5"),W("O6"),null);add("OQ4","OURO","Quartas",W("O7"),W("O8"),null);
  add("OS1","OURO","Semi",W("OQ1"),W("OQ2"),null);add("OS2","OURO","Semi",W("OQ3"),W("OQ4"),null);
  add("OF","OURO","Final",W("OS1"),W("OS2"),null);
  // Prata (quartas = jogos 9..12)
  add("PQ1","PRATA","Quartas",G("A",3),G("D",3),9);add("PQ2","PRATA","Quartas",G("B",3),G("C",3),10);
  add("PQ3","PRATA","Quartas",G("E",3),G("H",3),11);add("PQ4","PRATA","Quartas",G("F",3),G("G",3),12);
  add("PS1","PRATA","Semi",W("PQ1"),W("PQ2"),null);add("PS2","PRATA","Semi",W("PQ3"),W("PQ4"),null);
  add("PF","PRATA","Final",W("PS1"),W("PS2"),null);
  // Bronze (quartas = jogos 13..16)
  add("BQ1","BRONZE","Quartas",G("A",4),G("D",4),13);add("BQ2","BRONZE","Quartas",G("B",4),G("C",4),14);
  add("BQ3","BRONZE","Quartas",G("E",4),G("H",4),15);add("BQ4","BRONZE","Quartas",G("F",4),G("G",4),16);

  add("BF","BRONZE","Final",W("BS1"),W("BS2"),null);

}
var KOGAMES=KO();
function byId(id){return KOGAMES.find(function(k){return k.id===id})}
function originLabel(o){
  if(o.type==="group"){var nm=["","1º","2º","3º","4º"][o.pos]+" do Grupo "+o.group;var t=posTeam(o.group,o.pos);if(t&&t.name)return{txt:t.name,sub:nm,ready:true,team:t};return{txt:nm+" — a definir",sub:"",ready:false,team:null}}
  var g=byId(o.game);var w=winnerOf(g);if(!w)return{txt:winnerLabel(g)+" — a definir",sub:"",ready:false,team:null};
  var side=w==="A"?resolveKO(g).A:resolveKO(g).B;if(side&&side.team&&side.team.name)return{txt:side.team.name,sub:"Vencedor "+o.game,ready:true,team:side.team};
  return{txt:"Vencedor "+o.game+" — a definir",sub:"",ready:false,team:null};
}
function winnerLabel(g){if(g.a.type==="group"||g.b.type==="group"){var parts=[];[g.a,g.b].forEach(function(o){if(o.type==="group")parts.push(["","1º","2º","3º","4º"][o.pos]+" Grupo "+o.group)});return parts.join(" / ")}return "Vencedor"}
function resolveKO(g){var A=originLabel(g.a),B=originLabel(g.b);return{A:A,B:B}}
function koScore(id){var s=S.scores["K"+id];return s||{}}
function hasResultKO(g){var s=koScore(g.id);if(s.h==null||s.h===""||s.a==null||s.a===""||s.h==undefined)return false;if(+s.h===+s.a){var p=S.pen["K"+g.id];return p==="A"||p==="B"}return true}
function winnerOf(g){var s=koScore(g.id);if(s.h==null||s.h===""||s.a==null||s.a==="")return null;var r=resolveKO(g);if(!r.A.ready||!r.B.ready)return null;if(+s.h>+s.a)return "A";if(+s.a>+s.h)return "B";var p=S.pen["K"+g.id];return(p==="A"||p==="B")?p:null}
function winnerTeam(g){var w=winnerOf(g);if(!w)return null;var r=resolveKO(g);var s=w==="A"?r.A:r.B;return s.team}
function loserTeam(g){var w=winnerOf(g);if(!w)return null;var r=resolveKO(g);var s=w==="A"?r.B:r.A;return s.team}
function sameTeam(t,u){return t&&u&&t.group===u.group&&t.idx===u.idx}
function groupPts(t){try{var st=standings(t.group);var r=st.rows[t.idx];return r?r.Pts:0}catch(e){return 0}}
function koPts(t){var p=0;KOGAMES.forEach(function(g){var s=koScore(g.id);if(s.h==null||s.h===""||s.a==null||s.a==="")return;var r=resolveKO(g);if(!r.A.ready||!r.B.ready)return;var side=null;if(sameTeam(r.A.team,t))side="A";else if(sameTeam(r.B.team,t))side="B";else return;var h=+s.h,a=+s.a;if(h===a)p+=1;else if((side==="A"&&h>a)||(side==="B"&&a>h))p+=3});return p}
function totalPts(t){return t?groupPts(t)+koPts(t):-1}
function champion(serie){var f=byId(serie==="OURO"?"OF":serie==="PRATA"?"PF":"BF");return winnerTeam(f)}
function mesaKO(g){var m=S.mesa["K"+g.id];if(m!=null&&m!=="")return m;return g.mesaDef!=null?String(g.mesaDef):""}

var saveT=null,renderT=null;

function persist(force){
  try{S.updatedAt=new Date().toISOString()}catch(e){}
  try{localStorage.setItem(LS_STATE,JSON.stringify(S))}
  catch(e){setSaveStatus("⚠ não coube no navegador — exporte o JSON");alert("Imagem muito grande para o armazenamento local. O sistema comprimiu o envio; se persistir, use uma imagem menor e clique em Salvar + Exportar JSON.");return}
  try{
    var raw=localStorage.getItem(LS_BKP);var arr=raw?JSON.parse(raw):[];
    var last=arr.length?arr[arr.length-1]:null;
    if(force||!last||(Date.now()-last.ts>5*60*1000)){var slim=Object.assign({},S,{banner:"",logo:"",spotlight:(S.spotlight||[]).map(function(c){return{photo:"",team:c.team,name:c.name,city:c.city}})});var slimN=0;try{GROUPS.forEach(function(g){(slim.teams[g]||[]).forEach(function(t){if(t&&t.name)slimN++})})}catch(e3){}var lastN=-1;try{if(last)GROUPS.forEach(function(g){((last.state||{}).teams||{})[g]}) }catch(e4){}try{if(last){lastN=0;GROUPS.forEach(function(g){(((last.state||{}).teams||{})[g]||[]).forEach(function(t){if(t&&t.name)lastN++})})}}catch(e5){}if(!(slimN===0&&lastN>0)){arr.push({ts:Date.now(),state:slim});while(arr.length>5)arr.shift();try{localStorage.setItem(LS_BKP,JSON.stringify(arr))}catch(e2){}}}
  }catch(e){}
  setSaveStatus("● salvo "+new Date().toLocaleTimeString());
  queuePush();queueGhPush();
}

function slugFile(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||("insc-"+Date.now().toString(36))}
function ghPutFile(path,content,done){
  var c=ghCfg(),tk=ghToken();
  if(!c||!tk){done(401);return}
  var base="https://api.github.com/repos/"+c.owner+"/"+c.repo;
  var hdrs={"Authorization":"Bearer "+tk,"Accept":"application/vnd.github+json"};
  var url=base+"/contents/"+String(path).split("/").map(encodeURIComponent).join("/");
  fetch(base,{headers:hdrs,cache:"no-store"}).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(info){
    var br=(info&&info.default_branch)||ghBranch();
    return fetch(url+"?ref="+encodeURIComponent(br),{headers:hdrs,cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(fi){
      var body={message:"Copa: "+path,content:content,branch:br};
      if(fi&&fi.sha)body.sha=fi.sha;
      var h2={"Content-Type":"application/json"};for(var k in hdrs)h2[k]=hdrs[k];
      return fetch(url,{method:"PUT",headers:h2,body:JSON.stringify(body)});
    });
  }).then(function(r){if(!r.ok)throw (r&&r.status)||0;done(null)}).catch(function(st){done(st||"erro")});
}

window.jump=function(e,id){
  if(e.key!=="Enter"&&e.key!=="Tab")return;
  // deixa o Tab padrão acontecer primeiro? interceptamos para pular entre placares
  var inputs=[].slice.call(document.querySelectorAll("input[data-score]"));
  var i=inputs.findIndex(function(x){return x.id===id});
  if(e.key==="Enter"){e.preventDefault();if(i>=0&&i+1<inputs.length){inputs[i+1].focus();inputs[i+1].select()}}

};

function vCron(){

  function rodSec(num,title,sub,cls,inner){return '<div class="card cron-sec'+(cls==="gray"?" rh-gray-card":"")+'"><div class="rod-head '+(cls==="gray"?"rh-gray":"rh-red")+'">Rodada '+num+' - '+title+'</div>'+(sub?'<div class="rod-sub">'+sub+'</div>':"")+inner+'</div>'}

    +'<label class="btn-line btn-small" style="padding:9px 13px;cursor:pointer">📷 Foto<input type="file" accept="image/*" class="hidden" onchange="upSpotPhoto(this)"></label></div>'
    +'<div class="grid3" style="margin-top:8px"><input id="sp-team" placeholder="Time" value="'+esc(c.team)+'"><input id="sp-name" placeholder="Nome do participante" value="'+esc(c.name)+'"><input id="sp-city" placeholder="Cidade" value="'+esc(c.city)+'"></div>'
    +'<div class="row" style="margin-top:8px"><button class="btn-red btn-small" onclick="saveSpot()">💾 Salvar card</button><button class="btn-ghost btn-small" onclick="cancelSpot()">Cancelar</button></div></div>';
  }
  if(!S.spotlight.length)h+='<div class="card"><p class="muted">Nenhum card ainda. Clique em Novo card.</p></div>';
  S.spotlight.forEach(function(c,i){
    var thumb=c.photo?'<img src="'+c.photo+'" style="width:56px;height:56px;object-fit:cover;border-radius:50%">':'<span class="team-num">•</span>';
    h+='<div class="card"><div class="row">'+thumb
    +'<div style="flex:1"><b>'+(i+1)+'. '+esc(c.team||"(sem time)")+'</b><br><span class="muted">'+esc([c.name,c.city].filter(Boolean).join(" · ")||"—")+'</span></div>'
    +'<button class="btn-line btn-small" onclick="editSpot('+i+')">✏️ Editar</button><button class="btn-ghost btn-small" onclick="delSpot('+i+')">Excluir</button></div></div>';
  });
  return h;
}

/* ===== BANCO / ONLINE: export + import + servidor + GitHub ===== */
function syncUrl(){try{return (localStorage.getItem(LS_SYNC)||"").replace(/\/$/,"")}catch(e){return ""}}

/* ----- Banco no GitHub (arquivo JSON no repositorio, sem servidor ligado) ----- */
/* Repositorio padrao deste evento (usado quando nao esta no GitHub Pages) */
var GH_DEFAULT={owner:"thiago-cidao",repo:"colorado",branch:"main",file:"dados.json"};
function ghCfg(){
  var c=null;try{c=JSON.parse(localStorage.getItem(LS_GH)||"null")}catch(e){}
  if(c&&c.owner&&c.repo)return c;
  var m=/^([^.]+)\.github\.io$/i.exec(location.hostname);
  if(m){var parts=location.pathname.split("/").filter(Boolean);if(parts[0])return{owner:m[1],repo:parts[0],branch:"main",file:"dados.json"}}
  return Object.assign({},GH_DEFAULT);
}
function ghToken(){try{return localStorage.getItem(LS_GH_TOKEN)||""}catch(e){return ""}}
function ghFile(){var c=ghCfg();return (c&&c.file)||"dados.json"}
function ghBranch(){var c=ghCfg();return (c&&c.branch)||"main"}
function ghRawUrl(){var u=ghRawUrls();return u.length?u[0]:""}
function ghRawUrls(){
  var c=ghCfg();if(!c)return [];
  var brs=[];var b=ghBranch();if(brs.indexOf(b)<0)brs.push(b);
  if(brs.indexOf("main")<0)brs.push("main");
  if(brs.indexOf("master")<0)brs.push("master");
  var base="https://raw.githubusercontent.com/"+c.owner+"/"+c.repo+"/";
  return brs.map(function(x){return base+encodeURIComponent(x)+"/"+ghFile()+"?t="+Date.now()});
}
function ghTryRaw(i,done,fail){
  var urls=ghRawUrls();
  if(i>=urls.length){fail();return}
  fetch(urls[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(p){done(p)}).catch(function(){ghTryRaw(i+1,done,fail)});
}
function b64u8(s){return btoa(unescape(encodeURIComponent(s)))}
function storeLocal(){try{localStorage.setItem(LS_STATE,JSON.stringify(S))}catch(e){}}
/* ultima versao sabidamente igual ao que esta no GitHub (para saber se falta publicar) */
function ghLast(){try{return localStorage.getItem("copa3_gh_last")||""}catch(e){return ""}}
function ghSetLast(v){try{localStorage.setItem("copa3_gh_last",v||"")}catch(e){}}
function ghPending(){return (S.updatedAt||"")!==ghLast()}
function teamCountNow(){var n=0;try{GROUPS.forEach(function(g){(S.teams[g]||[]).forEach(function(t){if(t&&t.name)n++})})}catch(e){}return n}
function insCountNow(){return (S.inscritos||[]).length}
/* aviso curto mostrado nas telas de edicao do admin */
function ghWarnLine(){
  if(!isAdmin)return "";
  var c=ghCfg();if(!c)return "";
  if(!ghToken())return ' <b style="color:#D71414">⚠ ainda só neste aparelho — ligue o banco online na aba Banco / Online</b>';
  if(ghPending())return ' <b style="color:#D71414">⚠ falta publicar — aba Banco / Online → Publicar agora</b>';
  return ' <span style="color:#0a7a2f;font-weight:700">✔ no banco online</span>';
}
window.saveGhCfg=function(){
  var v=(document.getElementById("ghRepo")||{}).value||"";
  v=v.trim().replace(/\.git$/i,"").replace(/\/+$/,"");
  var owner="",repo="",m=/github\.com\/([^\/\s]+)\/([^\/\s]+)/i.exec(v);
  if(m){owner=m[1];repo=m[2]}else{var p=v.split("/").filter(Boolean);owner=p[0]||"";repo=p[1]||""}
  if(!owner||!repo){alert("Informe o repositório como usuario/repositorio (ou cole o link do GitHub).");return}
  var br=((document.getElementById("ghBranch")||{}).value||"main").trim()||"main";
  var fl=((document.getElementById("ghFile")||{}).value||"dados.json").trim()||"dados.json";
  try{localStorage.setItem(LS_GH,JSON.stringify({owner:owner,repo:repo,branch:br,file:fl}))}catch(e){}
  var tk=(document.getElementById("ghToken")||{}).value||"";
  if(tk.trim())try{localStorage.setItem(LS_GH_TOKEN,tk.trim())}catch(e){}
  render(true);alert("Configuração salva: "+owner+"/"+repo);
};
window.ghPublish=function(silent){
  var c=ghCfg();
  if(!c){if(!silent)alert("Configure primeiro o repositório do GitHub.");return}
  var tk=ghToken();
  if(!tk){if(!silent)alert("Falta o token do GitHub (só o admin precisa — veja as instruções na página).");return}
  // trava: nunca sobrescrever o GitHub com um banco vazio
  if(countTeams(S)===0){
    if(silent)return;
    if(!confirm("Este aparelho está SEM times (0 inscritos).\n\nPublicar agora vai SUBSTITUIR os dados do GitHub por um banco vazio.\n\nSe você quer apenas ver os dados que já existem, use “Baixar do GitHub ⬇”.\n\nTem certeza que quer publicar vazio?"))return;
  }
  try{S.updatedAt=new Date().toISOString()}catch(e){}
  storeLocal();
  var base="https://api.github.com/repos/"+c.owner+"/"+c.repo;
  var hdrs={"Authorization":"Bearer "+tk,"Accept":"application/vnd.github+json"};
  ghMsg("ghMsg","Publicando "+insCountNow()+" inscrito(s) / "+teamCountNow()+" time(s)…");
  // 1) confere repo/token e descobre a branch principal
  fetch(base,{headers:hdrs,cache:"no-store"})
  .then(function(r){if(!r.ok)throw r.status;return r.json()})
  .then(function(info){
    var br=(info&&info.default_branch)||ghBranch();
    var url=base+"/contents/"+encodeURIComponent(ghFile());
    // 2) pega o sha atual (se o arquivo já existir)
    return fetch(url+"?ref="+encodeURIComponent(br),{headers:hdrs,cache:"no-store"})
    .then(function(r){return r.ok?r.json():null})
    .then(function(fi){
      var body={message:"Copa: dados "+new Date().toISOString(),content:b64u8(JSON.stringify(S)),branch:br};
      if(fi&&fi.sha)body.sha=fi.sha;
      var h2={"Content-Type":"application/json"};for(var k in hdrs)h2[k]=hdrs[k];
      // 3) grava
      return fetch(url,{method:"PUT",headers:h2,body:JSON.stringify(body)});
    });
  })
  .then(function(r){
    if(!r.ok)throw 0;
    ghSetLast(S.updatedAt);render(false);
    ghMsg("ghMsg","✔ Publicado no GitHub em "+new Date().toLocaleTimeString()+" — "+insCountNow()+" inscrito(s), "+teamCountNow()+" time(s), "+Object.keys(S.scores||{}).length+" placar(es)");
    if(!silent)alert("Publicado! Agora aparece em todos os navegadores.\n\n"+insCountNow()+" inscrito(s) • "+teamCountNow()+" time(s) no banco.");
  })
  .catch(function(st){
    var d=(st===401||st===403)?"token sem permissão ou incorreto":(st===404?"repositório não encontrado (confira usuario/repo)":"falha de rede/permissão");
    ghMsg("ghMsg","✖ Não publicou: "+d+".");
    if(!silent)alert("Não foi possível publicar ("+d+").\n\nConfira:\n1) repositório usuario/repo\n2) token com permissão Contents: Read and write");
  });
};
window.ghPull=function(force){
  var c=ghCfg();
  if(!c){if(force)alert("Configure primeiro o repositório do GitHub.");return}
  ghTryRaw(0,function(p){
    if(!p||!p.teams){if(force)alert("Arquivo sem dados válidos.");return}
    var localN=countTeams(S),remoteN=countTeams(p);
    if(remoteN===0&&localN>0){
      if(force&&confirm("O repositório está VAZIO e este aparelho tem "+localN+" times.\n\nBaixar vai APAGAR os times da tela.\n\nEm vez disso, publique os dados deste aparelho (Publicar agora). Baixar mesmo assim?")){} else return;
    }
    if(!force){
      // nunca trocar dados de trabalho local por um banco online com MENOS times
      if(remoteN<localN)return;
      if(p.updatedAt&&S.updatedAt&&localN>0&&p.updatedAt<=S.updatedAt)return;
    }
    var had=countTeams(S);S=normalize(p);storeLocal();ghSetLast(p.updatedAt||S.updatedAt||"");render(had===0||force===true);
    if(force)alert("Dados baixados do GitHub ("+remoteN+" times).");
  },function(){if(force)alert("Não foi possível baixar. O arquivo "+ghFile()+" já existe no repositório (branch main) e o repositório é público?")});
};
function ghMsg(id,t){var m=document.getElementById(id);if(m)m.textContent=t}
var ghT=null;
function queueGhPush(){clearTimeout(ghT);if(!isAdmin)return;var c=ghCfg();if(!c||!ghToken())return;ghT=setTimeout(function(){ghPublish(true)},60000)}

  +'<div class="card"><h3>Banco online — GitHub (recomendado)</h3>'

  +'<input id="ghBranch" style="max-width:110px" placeholder="main" value="'+esc(gh.branch||"main")+'">'
  +'<input id="ghFile" style="max-width:150px" placeholder="dados.json" value="'+esc(gh.file||"dados.json")+'"></div>'
  +(isAdmin?'<div style="height:8px"></div><div class="row"><input id="ghToken" type="password" style="max-width:320px" placeholder="Token do GitHub (só admin)" value="'+(hasTok?"(token salvo)":"")+'"><button class="btn-line btn-small" onclick="saveGhCfg()">Salvar</button></div>':'')
  +'<div class="row" style="margin-top:8px">'
  +(isAdmin?'<button class="btn-red btn-small" onclick="ghPublish()">Publicar agora ⬆</button>':'')

  +'<p class="muted">Ou, mais restrito (só este repositório):</p><ol style="margin:4px 0 0 18px;padding:0"><li>github.com → foto → <b>Settings</b></li><li><b>Developer settings</b> → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li><li>Em <b>Repository access</b>: Only select repositories → escolha <b>colorado</b></li><li>Em <b>Permissions</b> → Repository permissions → <b>Contents: Read and write</b></li><li>Generate token e cole no campo acima</li></ol><p class="muted">O token fica só neste navegador. Não compartilhe prints dele.</p></details></div>'
  +'<div class="card"><h3>2) Arquivo (backup manual)</h3><div class="row">'
  +(isAdmin?'<button class="btn-red" onclick="exportJSON()">⬇ Exportar JSON</button> <label class="btn-line btn-small" style="padding:9px 13px;cursor:pointer">⬆ Importar JSON<input type="file" accept=".json" class="hidden" onchange="importJSON(this)"></label> <button class="btn-ghost" onclick="copyJSON()">Copiar JSON</button>':'<p class="muted">Entre como admin para exportar/importar.</p>')
  +'</div><h4>Backups automáticos neste aparelho</h4>'+bl+'</div>'

window.exportJSON=function(){saveNow();var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="copa-nada-vai-nos-separar.json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)};
window.copyJSON=function(){try{navigator.clipboard.writeText(JSON.stringify(S));alert("JSON copiado.")}catch(e){alert("Não foi possível copiar.")}};

window.restoreBkp=function(i){try{var arr=JSON.parse(localStorage.getItem(LS_BKP)||"[]");if(!arr[i])return;if(!confirm("Restaurar backup de "+new Date(arr[i].ts).toLocaleString()+"? (banner/logo e cards de divulgação atuais serão mantidos)"))return;var b=S.banner,l=S.logo,sp=S.spotlight;S=normalize(arr[i].state);S.banner=b;S.logo=l;S.spotlight=sp;saveNow(true);render(true)}catch(e){}};

/* ===== UPLOAD ===== */
function fileToResizedDataURL(file,maxW,maxH,q,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      var sc=Math.min(1,maxW/w,maxH/h);
      w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      var c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      try{cb(c.toDataURL("image/jpeg",q))}catch(e){cb(r.result)}
    };
    img.onerror=function(){cb(r.result)};
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
window.upBanner=function(el){var f=el.files[0];if(!f)return;fileToResizedDataURL(f,1600,600,0.82,function(url){S.banner=url;saveAllNow();render(true)})};
